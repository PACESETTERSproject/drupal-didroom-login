didroom_login.settings:
  path: '/admin/config/people/didroom-login'
  defaults:
    _form: '\Drupal\didroom_login\Form\SettingsForm'
    _title: 'DIDroom Login'
  requirements:
    _permission: 'administer didroom login'

didroom_login.login:
  path: '/didroom/login'
  defaults:
    _controller: '\Drupal\didroom_login\Controller\LoginController::start'
    _title: 'Log in with your wallet'
  requirements:
    _user_is_logged_in: 'FALSE'
  options:
    no_cache: 'TRUE'

didroom_login.status:
  path: '/didroom/login/status'
  defaults:
    _controller: '\Drupal\didroom_login\Controller\LoginController::status'
  methods: [GET]
  requirements:
    _user_is_logged_in: 'FALSE'
  options:
    no_cache: 'TRUE'

didroom_login.user_wallet:
  path: '/user/{user}/wallet-login'
  defaults:
    _form: '\Drupal\didroom_login\Form\WalletLoginForm'
    _title: 'Wallet login'
  requirements:
    _entity_access: 'user.update'
    _custom_access: '\Drupal\didroom_login\Form\WalletLoginForm::access'
    user: \d+
  options:
    parameters:
      user:
        type: entity:user
