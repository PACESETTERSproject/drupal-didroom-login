name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Drupal ${{ matrix.core }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - core: '^10.3'
          - core: '^11'
            lint: true
    steps:
      - uses: actions/checkout@v4

      - uses: ddev/github-action-setup-ddev@v1
        with:
          autostart: false

      - name: Build Drupal with the module
        run: |
          ddev dotenv set .ddev/.env.web --drupal-core '${{ matrix.core }}'
          ddev start
          ddev poser
          ddev symlink-project
          ddev exec "grep 'const VERSION' web/core/lib/Drupal.php"

      - name: PHPUnit (unit, kernel, functional, JavaScript)
        run: ddev phpunit

      - name: PHP_CodeSniffer
        if: matrix.lint
        run: ddev phpcs

      - name: PHPStan
        if: matrix.lint
        run: ddev phpstan

      - name: ESLint and Stylelint
        if: matrix.lint
        run: |
          ddev exec 'cd web/core && yarn install'
          ddev eslint
          ddev stylelint

  verifier:
    name: Verifier proxy and config
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check the scripts and compose file
        run: |
          bash -n deploy/verifier/setup.sh deploy/verifier/test-proxy.sh scripts/dev-verifier.sh
          VERIFIER_TOKEN=ci docker compose -f deploy/verifier/compose.yaml --profile tunnel config -q

      - name: Test the proxy rules
        run: deploy/verifier/test-proxy.sh

  issuer:
    name: Issuer proxy, email codes and config
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check the scripts and compose file
        run: |
          bash -n deploy/issuer/setup.sh deploy/issuer/configure.sh deploy/issuer/test-proxy.sh scripts/dev-issuer.sh
          python3 -m py_compile deploy/issuer/test-issuance.py
          ISSUER_NAME=ci MAIL_FROM=ci@example.org docker compose -f deploy/issuer/compose.yaml --profile tunnel --profile dev config -q

      - name: Test the email code service
        working-directory: deploy/issuer/email-code
        run: docker run --rm -v "$PWD:/src:ro" -w /src -e PYTHONDONTWRITEBYTECODE=1 python:3.13.16-alpine3.24 python -m unittest -v

      - name: Test the proxy rules
        run: deploy/issuer/test-proxy.sh
