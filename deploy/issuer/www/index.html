<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Email credential</title>
  <link rel="icon" href="logo.svg">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f7fa;
      --card: #ffffff;
      --text: #1a2230;
      --muted: #5a6577;
      --accent: #1d4e89;
      --on-accent: #ffffff;
      --border: #c9d1dc;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #11161e;
        --card: #1a212c;
        --text: #e6ebf2;
        --muted: #a3adbd;
        --accent: #8ab4f8;
        --on-accent: #0b1a2e;
        --border: #3a4556;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 28rem; margin: 0 auto; padding: 2rem 1rem; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; text-align: center; }
    h1 { font-size: 1.4rem; margin: .75rem 0 .5rem; }
    p { margin: 0 0 1rem; }
    .muted { color: var(--muted); }
    .qr { display: block; width: 100%; max-width: 18rem; margin: 0 auto 1rem; background: #fff; padding: .5rem; border-radius: 8px; image-rendering: pixelated; }
    a.button { display: block; padding: .75rem; border-radius: 8px; background: var(--accent); color: var(--on-accent); font-weight: 600; text-decoration: none; }
    a.button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <img src="logo.svg" alt="" width="56" height="56">
      <h1>Get an email credential</h1>
      <p class="muted">Scan the code with your wallet. It sends a one-time code to your address, and once you enter it, your wallet holds a credential that proves the address is yours.</p>
      <img class="qr" src="credential_issuer/qrcode" alt="QR code of the credential offer">
      <p class="muted">On the phone with the wallet?</p>
      <a class="button" id="open" href="#">Open in wallet app</a>
    </div>
  </main>
  <script>
    // The link is the same offer as the QR code.
    fetch('credential_issuer/deeplink')
      .then((response) => response.ok ? response.text() : Promise.reject(response.status))
      .then((url) => { document.getElementById('open').href = url.trim(); })
      .catch(() => { document.getElementById('open').hidden = true; });
  </script>
</body>
</html>
